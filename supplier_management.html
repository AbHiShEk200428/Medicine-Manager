<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
<link rel="stylesheet" href="style.css">
    <script src="Sidebar.js"></script>
</head>
<body>
    <div class="container py-3">
        <h1 id="Menubar_Call" class="h4 mb-3 text-primary">Suppliers</h1>
        <div class="card p-4 shadow-sm mb-4">
            <form action="supplier_management.html" id="Supplier_form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="Supplier_Name" class="form-label fw-semibold">Supplier Name</label>
                        <input type="text" class="form-control focus-ring" id="Supplier_Name">
                    </div>
                    <div class="col-md-6">
                        <label for="Add_Contact" class="form-label fw-semibold">Contact Person</label>
                        <input type="text" class="form-control focus-ring" id="Add_Contact">
                    </div>
                    <div class="col-md-6">
                        <label for="Add_Phone" class="form-label fw-semibold">Phone</label>
                        <input type="number" class="form-control focus-ring" id="Add_Phone">
                    </div>
                    <div class="col-md-6">
                        <label for="Supplier_Email" class="form-label fw-semibold">Email</label>
                        <input type="email" class="form-control focus-ring" id="Supplier_Email">
                    </div>
                    <div class="col-md-6">
                        <label for="Add_Address" class="form-label fw-semibold">Address</label>
                        <input type="text" class="form-control focus-ring" id="Add_Address">
                    </div>
                    <div class="col-md-6">
                        <label for="Add_GST" class="form-label fw-semibold">GST Number</label>
                        <input type="text" class="form-control focus-ring" id="Add_GST">
                    </div>
                </div>

                <p id="Supplier_Validity" class="text-danger small mt-2 mb-3 text-center"></p>

                <div class="d-grid gap-2 col-md-6 mx-auto">
                    <button type="button" class="btn btn-primary rounded-3 btn-lg" id="Add_SupplierBtn">Add Supplier</button>
                </div>
            </form>
        </div>

        <div class="input-group mb-3">
            <label for="supplier_search_input" class="visually-hidden">Search suppliers</label>
            <input type="text" id="supplier_search_input" class="form-control form-control-lg focus-ring" placeholder="Search suppliers..." aria-label="Search suppliers">
            <button type="button" id="supplier_search_btn" class="btn btn-info">Search</button>
        </div>
        <p id="supplier_search_validity" class="text-danger small mb-3"></p>

        <div class="table-responsive">
            <table id="Supplier_Table" class="table table-hover text-center text-nowrap table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Supplier</th>
                        <th scope="col">Contact</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>ABC Pharma</td>
                        <td>Anil</td>
                        <td>14343114</td>
                        <td><button class="btn btn-sm btn-light border Purchase_Edit">Edit</button> / <button class="btn btn-sm btn-light border Purchase_Delete">Delete</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
    $(document).ready(function(){
        let Supplier_ID=2;
        $("#Add_SupplierBtn").click(function(event){
            event.preventDefault();
            let Supplier= document.getElementById("Supplier_Name").value;
            let Contact= document.getElementById("Add_Contact").value;
            let Phone= document.getElementById("Add_Phone").value;
            let Email= document.getElementById("Supplier_Email").value;
            let Address= document.getElementById("Add_Address").value;
            let GSTNumber= document.getElementById("Add_GST").value;
            var new_row=`
                <tr>
                <td>${Supplier_ID}</td>
                <td>${Supplier}</td> 
                <td>${Contact}</td>   
                <td>${Phone}</td> 
                <td><button>Edit</button>/ <button>Delete</button></td>
                </tr>`;

            let Supplier_Validity= document.getElementById("Supplier_Validity");
            let Email_validity=Email.includes("@gmail.com");
        if(Supplier==""||Supplier==null){
            Supplier_Validity.textContent="Enter Supplier name";
        }
        else if(Contact==""||Contact==null){
            Supplier_Validity.textContent="Enter Contact name";
        }
        else if(Phone==""||Phone==null){
            Supplier_Validity.textContent="Enter Phone number";
        }
        else if(Email==""||Email==null){
            Supplier_Validity.textContent="Enter a valid Email";
        }
        else if(!Email_validity){
            Supplier_Validity.textContent="Enter valid Email";
        }
        else if(Address==""||Address==null){
            Supplier_Validity.textContent="Enter the Address";
        }
        else if(GSTNumber==""||GSTNumber==null){
            Supplier_Validity.textContent="Enter the GST Number";
        }
        else {
            $("#Supplier_Table tbody").append(new_row);
            Supplier_ID++;

            document.getElementById("Supplier_Name").value="";
            document.getElementById("Add_Contact").value="";
            document.getElementById("Add_Phone").value="";
            document.getElementById("Supplier_Email").value="";
            document.getElementById("Add_Address").value="";
            document.getElementById("Add_GST").value="";

        }
        });
        $("#supplier_search_btn").click(function(e){
            e.preventDefault();
        let Search_input=document.getElementById("supplier_search_input").value;
        Search_input=Search_input.toLowerCase();
        if(Search_input==""||Search_input==null){
            $("#supplier_search_validity").text("Enter in search input");
        }
        
            $("#Supplier_Table tbody tr").each(function(){
            
                let row_search=$(this).text().toLowerCase();
                
                if(row_search.includes(Search_input)){
                    $(this).show();
                }
                else{
                    $(this).hide();
                } 
            });

        });
});
</script>
</body>
</html>
