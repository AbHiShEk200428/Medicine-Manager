<div class="container py-3">
    <div class="card p-4 shadow-sm mb-4">
        <h4 class="mb-3 text-primary">Add Purchase</h4>

        <form class="row gy-2 gx-3 align-items-centre">
          <div class="row"  >
                <div class="col">
                    <label for="Purchase_Supplier" class="col-sm-2 col-form-label">Role</label>
                              <select class="form-select form-control focus-ring form-control focus-ring" id="Purchase_Supplier">
                                  <option value="None">==Select Supplier==</option>
                                  <option value="ABC Pharma">ABC Pharma</option>
                                  <option value="XYZ Pharmaceuticals">XYZ Pharmaceuticals</option>
                                  <option value="123 Meds">123 Meds</option>
                              </select>
                </div>
                <div class="col">
                          <label for="Add_PurchaseDate" class="form-label fw-semiboldl">PurchaseDate</label>
                          <input type="date" class="form-control form-control focus-ring" id="Add_PurchaseDate" placeholder="Enter purchase date">
                      </div>
          </div>

          <div class="row">
              <div class="col">
                  <label for="Add_Medicine" class="form-label fw-semibold">Medicine</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_Medicine" placeholder="Enter medicine name">
              </div>
              <div class="col">
                  <label for="Add_BatchNum" class="col-sm-2 col-form-label">Batch Number</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_BatchNum" placeholder="Enter Batch number">
              </div>
          </div>
          <div class="row">
              <div class="col">
                  <label for="Add_Manufacture" class="col-sm-2 col-form-label">Manufacturer</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_Manufacture" placeholder="Enter manufacturer name">
              </div>
              <div class="col">
                  <label for="Add_ExpiryDate" class="col-sm-2 col-form-label">Expiry Date</label>
                  <input type="date" class="form-control form-control focus-ring" id="Add_ExpiryDate" placeholder="Enter expiry date">
              </div>
          </div>
          <div class="row">
              <div class="col">
                  <label for="Add_Quantity" class="col-sm-2 col-form-label">Quantity</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_Quantity" placeholder="Enter quantity">
              </div>
              <div class="col">
                  <label for="Add_PurchasePrice" class="col-sm-2 col-form-label">Purchase Price</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_PurchasePrice" placeholder="Enter purchase price">
              </div>
          </div>
          <div class="row">
              <div class="col">
                  <label for="Add_SellingPrice" class="col-sm-2 col-form-label">Selling Price</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_SellingPrice" placeholder="Enter selling price">
              </div>
              <div class="col">
                  <label for="Add_Remarks" class="col-sm-2 col-form-label">Remarks</label>
                  <input type="text" class="form-control form-control focus-ring" id="Add_Remarks" placeholder="Enter remarks">
              </div>
              
          </div>

            
              <p id="Purchase_Validity" class="text-danger small mt-2 mb-3 text-center"></p>

              <div class="d-grid gap-2 col-md-6 mx-auto">
                  <button type="button" class="btn btn-primary rounded-3 gap-4 btn-lg" id="Add_PurchaseBtn">Add Purchase</button>
              </div>
          </form>

    </div>

       <div class="input-group mb-4 col-md-6 gap-2">
        <input type="search" id="purchase_search_input" class="form-control form-control-lg focus-ring col-md-6" placeholder="Search purchases...">
        <button id="purchase_search_btn" class="btn btn-info col-md-4 gap-3">Search</button>
    </div>

        <div class="table-responsive">
        <table id="Purchase_Table" class="table table-hover text-center text-nowrap table-bordered align-middle">
            <thead class="table-dark">
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Supplier</th>
                    <th scope="col">Medicine</th>
                    <th scope="col">Batch</th>
                    <th scope="col">Quantity</th>
                    <th scope="col">Expiry Date</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>ABC</td>
                    <td>Paracetamol</td>
                    <td>P001</td>
                    <td>100</td>
                    <td>09-09-26</td>
                    <td>
                        <button class="btn btn-sm btn-light border"><img src="images/edit.png" width="16" /></button>
                        <button class="btn btn-sm btn-light border"><img src="images/trash.png" width="16" /></button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    $(document).ready(function(){
     let Purchase_ID=2;
     $("#Add_PurchaseBtn").click(function(event){
        event.preventDefault();

        let Supplier= document.getElementById("Purchase_Supplier").value; 
        let PurchaseDate= document.getElementById("Add_PurchaseDate").value;
        let Medicine= document.getElementById("Add_Medicine").value;
        let Batch= document.getElementById("Add_BatchNum").value;
        let Manufacture= document.getElementById("Add_Manufacture").value;
        let Expiry= document.getElementById("Add_ExpiryDate").value;
        let Quantity= document.getElementById("Add_Quantity").value;
        let PurchasePrice= document.getElementById("Add_PurchasePrice").value;
        let SellingPrice= document.getElementById("Add_SellingPrice").value;
        let Remarks= document.getElementById("Add_Remarks").value;
        var new_row=`
        <tr>
        <td>${Purchase_ID}</td>
        <td>${Supplier}</td>
        <td>${Medicine}</td> 
        <td>${Batch}</td>
        <td>${Quantity}</td>
        <td>${Expiry}</td>
        <td><button class="Purchase_Edit">Edit</button>/ <button class="Purchase_Delete">Delete</button></td>
        </tr>`;
        let Purchase_Validity= document.getElementById("Purchase_Validity");

        
        if(Supplier==""||Supplier==null){
              Purchase_Validity.textContent="Supplier name is Empty";
        }
        else if(PurchaseDate==""||PurchaseDate==null){
            Purchase_Validity.textContent="Purchase date is Empty";
        }
        else if(Medicine==""||Medicine==null){
            Purchase_Validity.textContent="Medicine name is Empty";
        }
        else if(Batch==""||Batch==null){
            Purchase_Validity.textContent="Batch number is Empty";
        }
        else if(Manufacture==""||Manufacture==null){
            Purchase_Validity.textContent="Manufacture name is Empty";
        }
        else if(Expiry==""||Expiry==null){
            Purchase_Validity.textContent="Expiry date is Empty";
        }
        else if(Quantity==""||Quantity==null){
            Purchase_Validity.textContent="Quantity is Empty";
        }
        else if(PurchasePrice==""||PurchasePrice==null){
            Purchase_Validity.textContent="Purchase price is Empty";
        }
        else if(SellingPrice==""||SellingPrice==null){
            Purchase_Validity.textContent="Selling price is Empty";
        }
        else{
            $("#Purchase_Table tbody").append(new_row);
            Purchase_ID++;

            document.getElementById("Purchase_Supplier").value="";
            document.getElementById("Add_PurchaseDate").value="";
            document.getElementById("Add_Medicine").value="";
            document.getElementById("Add_BatchNum").value="";
            document.getElementById("Add_Manufacture").value="";
            document.getElementById("Add_ExpiryDate").value="";
            document.getElementById("Add_Quantity").value="";
            document.getElementById("Add_PurchasePrice").value="";
            document.getElementById("Add_SellingPrice").value="";
            document.getElementById("Add_Remarks").value="";
            document.getElementById("Purchase_Validity").textContent="";
        }

     });

    $("#purchase_search_btn").click(function(e){
        e.preventDefault();
    let Search_input=document.getElementById("purchase_search_input").value;
    Search_input=Search_input.toLowerCase().trim();
    if(Search_input==""||Search_input==null){
        $("#purchase_search_validity").text("Enter in search input");
        }
       
        $("#Purchase_Table tbody tr").each(function(){
        
            let row_search=$(this).text().toLowerCase();
            
            if(row_search.includes(Search_input)){
                $(this).show();
            }
            else{
                $(this).hide();
            } 
        });

    });  
 
    });
</script>
</body>
</html>
