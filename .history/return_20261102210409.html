<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
    <script src="Sidebar.js"></script>
</head>
<body>
    <div class="container py-3">
        <h1 id="Menubar_Call" class="h4 mb-3 text-primary">Medicine Return</h1>
        <div class="card p-4 shadow-sm mb-4">
            <form action="return.html">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="Return_Medicine" class="form-label fw-semibold">Medicine</label>
                        <select name="" id="Return_Medicine" class="form-select focus-ring">
                            <option value="None">==Select==</option>
                            <option value="">Paracetamol</option>
                            <option value="">Cetrizine</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="Return_Batch" class="form-label fw-semibold">Batch</label>
                        <select name="" id="Return_Batch" class="form-select focus-ring">
                            <option value="None">==Select==</option>
                            <option value="">P001</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="Return_Stock" class="form-label fw-semibold">Current quantity</label>
                        <p id="Return_Stock" class="form-control bg-light mb-0 disabled">[]</p>
                    </div>
                    <div class="col-md-6">
                        <label for="Add_ReturnQty" class="form-label fw-semibold">Return Quantity</label>
                        <input type="number" min="1" id="Add_ReturnQty" class="form-control focus-ring">
                    </div>
                    <div class="col-md-6">
                        <label for="Return_Customer" class="form-label fw-semibold">Customer</label>
                        <input type="text" id="Return_Customer" class="form-control focus-ring">
                    </div>
                    <div class="col-md-6">
                        <label for="Return_Date" class="form-label fw-semibold">Return Date</label>
                        <input type="date" id="Return_Date" class="form-control focus-ring">
                    </div>
                    <div class="col-md-6">
                        <label for="Add_reason" class="form-label fw-semibold">Reason</label>
                        <input type="text" id="Add_reason" class="form-control focus-ring">
                    </div>
                    <div class="col-md-6">
                        <label for="Return_Remarks" class="form-label fw-semibold">Remarks</label>
                        <input type="text" id="Return_Remarks" class="form-control focus-ring">
                    </div>
                </div>
                <div class="d-grid gap-2 col-md-6 mx-auto mt-4">
                    <button id="ReturnMed_Btn" class="btn btn-primary btn-lg rounded-3">Return Medicine</button>
                </div>
            </form>
        </div>

        <div class="table-responsive">
            <table id="MedReturn_Table" class="table table-hover text-center text-nowrap table-bordered align-middle">
                <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Medicine</th>
                        <th scope="col">Batch</th>
                        <th scope="col">Quantity</th>
                        <th scope="col">Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Paracetamol</td>
                        <td>P001</td>
                        <td>10</td>
                        <td>09-09-2026</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
