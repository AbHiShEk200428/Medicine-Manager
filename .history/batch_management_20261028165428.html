
    <div style="text-align: left;">
        
    <label for="Search_input">Search:</label>
    <br>
    <input type="text" id="Search_input">
<br>
    <label for="">Medicine:</label>
    <br>
    <select name="" id="Select_Medicine">
        <option value="None">--Select--</option>
        <option value="Paracetamol">Paracetamol</option>
    </select>
<br>
        <label for="Select_Expiry">Expiry:</label>
        <br>
        <select name="Expiry Status" id="Select_Expiry">
            <option value="None">==Select==</option>
            <option value="All">ALL</option>
            <option value="Normal">Normal</option>
            <option value="Near_Expiry">Near Expiry</option>
            <option value="Expired">Expired</option>
        </select>
        <br>
        <button type="button" id="Search_Btn">Search</button>
    </div>
        <br>
        <p id="Search_validity"></p>
<table id="Batch_Table">
    <thead>
        <tr>
            <th>ID</th>
            <th>Medicine</th>
            <th>Batch</th>
            <th>Mfg Date</th>
            <th>Expiry</th>
            <th>Quantity</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>1</td>
            <td>Paracetamol</td>
            <td>P001</td>
            <td>01-03-2026</td>
            <td>01-01-2028</td>
            <td>100</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Paracetamol</td>
            <td>P002</td>
            <td>01-03-2026</td>
            <td>01-03-2027</td>
            <td>50</td>
        </tr>
    </tbody>
</table>

<script>
    $(document).ready(function(){
        $("#Search_Btn").click(function(e){
        e.preventDefault();
    let Search_input=document.getElementById("Search_input").value;
    let Medicine_input= document.getElementById("Select_Medicine").value;
    let Expiry_Status= document.getElementById("Select_Expiry").value;

    Search_input=Search_input.toLowerCase().trim();
    Medicine_input=Medicine_input.toLowerCase().trim();
    if(Search_input==""||Search_input==null){
        $("#Search_validity").text("Enter search input");
        }
    else if(Medicine_input=="None"||Medicine_input==null){
            $("#Search_validity").text("Select a medicine")
        }
    else if(Expiry_Status="None"){
        $("#Search_validity").text("Select expiry status")
    }
       
        $("#Batch_Table tbody tr").each(function(){
        
            let row_search=$(this).text().toLowerCase();
            
            if(row_search.includes(Search_input||Medicine_input)){
                $(this).show();
            }
            else{
                $(this).hide();
            } 
        });

    });  
    });
</script>
</body>
</html>
