<div class="container py-3">
    <!-- Stat Cards Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card text-bg-primary shadow-sm text-center  py-3">
                <div class="card-body transition ease-in-out delay-150 -translate-y-px-hover duration-300 scale-110-hover">
                    <h6 class="card-title text-uppercase">Medicines</h6>
                    <h2 class="display-6 fw-bold mb-0" id="dash_medicines">125</h2>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card text-bg-info shadow-sm text-center py-3">
                <div class="card-body">
                    <h6 class="card-title text-uppercase">Batches</h6>
                    <h2 class="display-6 fw-bold mb-0" id="dash_batches">240</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-success shadow-sm text-center py-3">
                <div class="card-body">
                    <h6 class="card-title text-uppercase">Total Stock</h6>
                    <h2 class="display-6 fw-bold mb-0" id="dash_total_stock">5,420</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert / Status Cards Row -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card border-warning shadow-sm text-center py-3">
                <div class="card-body text-warning">
                    <h6 class="card-title text-uppercase">Low Stock</h6>
                    <h2 class="display-6 fw-bold mb-0">8</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-info shadow-sm text-center py-3">
                <div class="card-body text-info">
                    <h6 class="card-title text-uppercase">Near Expiry</h6>
                    <h2 class="display-6 fw-bold mb-0">12</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-danger shadow-sm text-center py-3">
                <div class="card-body text-danger">
                    <h6 class="card-title text-uppercase">Expired</h6>
                    <h2 class="display-6 fw-bold mb-0">3</h2>
                </div>
            </div>
        </div>
    </div>
</div>
