<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>

    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet" integrity="sha256-V6lu+OdYNKTKTsVFBuQsyIlDiRWiOmtC8VQ8Lzdm2i4=" crossorigin="anonymous">

</head>
<body>
  
<div class="container">
        <form class="row gy-2 gx-3 align-items-center">

        <div class="row">
            <div class="col">
                <label for="username" class="col-sm-2 col-form-label" id="fullname-label">Fullname</label>
                <input type="text" class="form-control" id="Add_Fullname" placeholder="Enter fullname">
            </div>
            <div class="col">
                <label for="username" class="col-sm-2 col-form-label">Username</label>
                <input type="text" class="form-control" id="Add_Username" placeholder="Enter username">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="email" class="col-sm-2 col-form-label">Email</label>
                <input type="email" class="form-control" id="Add_Email" placeholder="Enter email">
            </div>
            <div class="col">
                <label for="role" class="col-sm-2 col-form-label">Role</label>
                <select class="form-select" id="Add_Role">
                    <option value="None">Select role</option>
                    <option value="admin">Admin</option>
                    <option value="user">User</option>
                </select>
            </div>

        </div>

        <button type="button" class="btn btn-discovery">Add User</button>

        
         
    </form>
</div>
    

    

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>

</body>
</html>
