<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/fastbootstrap@2.2.0/dist/css/fastbootstrap.min.css" rel="stylesheet" integrity="sha256-V6lu+OdYNKTKTsVFBuQsyIlDiRWiOmtC8VQ8Lzdm2i4=" crossorigin="anonymous">
  </head>
  <body>
<form class="row gy-2 gx-3 align-items-center">

        <div class="row">
            <div class="col">
                <label for="username" class="col-sm-2 col-form-label" id="fullname-label">Fullname</label>
                <input type="text" class="form-control form-control focus-ring" id="Add_Fullname" placeholder="Enter fullname">
            </div>
            <div class="col">
                <label for="username" class="col-sm-2 col-form-label">Username</label>
                <input type="text" class="form-control form-control focus-ring" id="Add_Username" placeholder="Enter username">
            </div>
        </div>

        <div class="row">
            <div class="col">
                <label for="email" class="col-sm-2 col-form-label">Email</label>
                <input type="email" class="form-control form-control focus-ring" id="Add_Email" placeholder="Enter email">
            </div>
            <div class="col">
                <label for="role" class="col-sm-2 col-form-label">Role</label>
                <select class="form-select form-control focus-ring form-control focus-ring" id="Add_Role">
                    <option value="None">Select role</option>
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                    <option value="Supplier">Supplier</option>
                </select>
            </div>

        </div>

        <p id="User_validity"></p>

        <div class="d-grid gap-2 col-6 mx-auto">
            <button type="button" class="btn btn-primary rounded-pill" id="Add_user">Add User</button>
        </div>
        
        <div class="toast-container position-fixed bottom-0 start-0 p-6">
        <div class="toast text-bg-success" id="AddUser_Toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body">
            <div class="d-flex gap-4">
                <span><i class="fa-solid fa-circle-check fa-lg icon-success"></i></span>
                <div class="d-flex flex-column flex-grow-1 gap-2">
                <div class="d-flex align-items-center">
                    <span class="fw-semibold
  <div class="row"  >
      <div cldiv="col">
          <label for="Purchase_Supplier" class="col-sm-2 col-form-label">Role</label>
                    <select class="form-select form-control focus-ring form-control focus-ring" id="Purchase_Supplier">
                        <option value="None">==Select Supplier==</option>
                        <option value="ABC Pharma">ABC Pharma</option>
                        <option value="XYZ Pharmaceuticals">XYZ Pharmaceuticals</option>
                        <option value="123 Meds">123 Meds</option>
                    </select>
      </div>
       <div class="col">
                <label for="Add_PurchaseDate" class="col-sm-2 col-form-label">PurchaseDate</label>
                <input type="text" class="form-control form-control focus-ring" id="Add_PurchaseDate" placeholder="Enter purchase date">
            </div>
</div>

<div class="row">
    <div class="col">
        <label for="Add_Medicine" class="col-sm-2 col-form-label">Medicine</label>
        <input type="text" class="form-control form-control focus-ring" id="Add_Medicine" placeholder="Enter medicine name">
    </div>
</div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
  </body>
</html>
